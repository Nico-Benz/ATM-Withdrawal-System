<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ATM Withdrawal System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="atm-container">
        <h1>🏧 ATM Withdrawal System</h1>
        <p class="balance-display">Current Balance: ₱<span id="balanceText">500.00</span></p>

        <label for="withdrawalInput">Enter Withdrawal Amount:</label>
        <input type="number" id="withdrawalInput" placeholder="e.g. 200">

        <button onclick="process()">Withdraw</button>

        <p id="messageOutput" class="message"></p>
    </div>

    <script src="atm.js"></script>
</body>
</html>
